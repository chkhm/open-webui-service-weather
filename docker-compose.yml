services:
  ollama:
    # Ollama runs as its own service rather than bundled inside the open-webui
    # image, so the two can be upgraded independently. Pinned to the same
    # version the bundled image shipped (0.32.15); multi-arch, covering
    # linux/amd64 and linux/arm64.
    image: ollama/ollama@sha256:57d60e686821ea81a7748a3ec8141308c8b8f95b27105713954abf7a6529e700
    container_name: ollama
    # Only started with COMPOSE_PROFILES=gpu in .env. Without it, Open WebUI
    # expects a native Ollama on the host via OLLAMA_BASE_URL (see .env.example);
    # Docker Desktop on macOS cannot pass a GPU to a container.
    profiles: [gpu]
    restart: unless-stopped
    volumes:
      - open-webui-ollama:/root/.ollama
    # The GPU belongs to whatever runs the model. Remove this block to run
    # CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    expose:
      - "11434"
    networks:
      default:
        aliases:
          - ollama

  open-webui:
    # Pinned by digest rather than a floating tag. The weather tool depends on
    # how Open WebUI resolves tool-server URLs and on the
    # tool_server.connections key in webui.db, neither of which is documented,
    # so an unattended image update could break it silently. This digest is
    # v0.11.3 -- the plain image, without bundled Ollama -- and is a multi-arch
    # index covering linux/amd64 and linux/arm64.
    # To upgrade deliberately, see "Upgrading" in README.md.
    image: ghcr.io/open-webui/open-webui@sha256:751b617714b91e4cfd0186a509c72480c858e012976103b09a30dad053c36175
    container_name: "open-webui"
    ports:
      - "12000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      # The container under the gpu profile by default; override in .env to reach
      # a native Ollama, e.g. http://host.docker.internal:11434.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      # Registers the weather proxy as an external OpenAPI tool server. A
      # supported feature, though missing from the environment variable
      # reference (open-webui#15574). This seeds a fresh volume; Open WebUI
      # treats env values as defaults, so once the connection exists in
      # webui.db (e.g. after editing it in the admin UI) the stored value
      # takes precedence over this one.
      - >-
        TOOL_SERVER_CONNECTIONS=[{"url": "http://weather-proxy:5005",
        "path": "openapi.json", "type": "openapi", "auth_type": "bearer",
        "headers": null, "key": "", "spec_type": "url", "spec": "",
        "config": {"enable": true, "function_name_filter_list": "",
        "access_grants": []},
        "info": {"id": "", "name": "get_weather",
        "description": "Retrieve short term weather forecast"}},
        {"url": "http://currency-proxy:5006", "path": "openapi.json",
        "type": "openapi", "auth_type": "bearer", "headers": null, "key": "",
        "spec_type": "url", "spec": "", "config": {"enable": true,
        "function_name_filter_list": "", "access_grants": []}, "info": {"id": "",
        "name": "convert_currency",
        "description": "Convert amounts between currencies at ECB reference rates"}}]
    # Lets a native Ollama be reached as host.docker.internal on Linux hosts too;
    # Docker Desktop provides the name by itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      weather-proxy:
        condition: service_started
      currency-proxy:
        condition: service_started
      # Optional: only present when the gpu profile is active.
      ollama:
        condition: service_started
        required: false

  weather-proxy:
    build: ./weather-proxy   # directory that holds the Dockerfile from §3.2
    container_name: weather-proxy
    restart: unless-stopped
    environment:
      - OWM_API_KEY=${OWM_API_KEY}   # we’ll pass it from host env
    expose:
      - "5005"
    # Give it a stable DNS name for the other service
    networks:
      default:
        aliases:
          - weather-proxy

  currency-proxy:
    build: ./currency-proxy
    container_name: currency-proxy
    restart: unless-stopped
    expose:
      - "5006"
    # Stable DNS name for the other services
    networks:
      default:
        aliases:
          - currency-proxy

networks:
  default:
    driver: bridge

volumes:
  # Pinned to the plain volume names (no compose project prefix) so the stack
  # keeps using the existing open-webui data instead of a fresh empty volume.
  open-webui:
    name: open-webui
  open-webui-ollama:
    name: open-webui-ollama
