services:
  open-webui:
    # Pinned by digest rather than the floating :ollama tag. This project
    # depends on Open WebUI internals -- the TOOL_SERVER_CONNECTIONS variable
    # and how it resolves tool-server URLs -- which carry no compatibility
    # promise, so an unattended image update could break the weather tool
    # silently. This digest is the :ollama tag as of 2026-08-31 (v0.11.3), a
    # multi-arch index covering linux/amd64 and linux/arm64.
    # To upgrade deliberately, see "Upgrading Open WebUI" in README.md.
    image: ghcr.io/open-webui/open-webui@sha256:d1f80a9554e4b7de87ded24a4d59558c4dc02453d1b1c83640b3f6039b0976f6
    container_name: "open-webui"
    ports:
      - "12000:8080"
    volumes:
      - open-webui:/app/backend/data
      - open-webui-ollama:/root/.ollama
    environment:
      # Registers the weather proxy as an external OpenAPI tool server. This
      # seeds a fresh volume; Open WebUI treats env values as defaults, so once
      # the connection exists in webui.db (e.g. after editing it in the admin
      # UI) the stored value takes precedence over this one.
      - >-
        TOOL_SERVER_CONNECTIONS=[{"url": "http://weather-proxy:5005",
        "path": "openapi.json", "type": "openapi", "auth_type": "bearer",
        "headers": null, "key": "", "spec_type": "url", "spec": "",
        "config": {"enable": true, "function_name_filter_list": "",
        "access_grants": []},
        "info": {"id": "", "name": "get_weather",
        "description": "Retrieve short term weather forecast"}}]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - weather-proxy

  weather-proxy:
    build: ./weather-proxy   # directory that holds the Dockerfile from §3.2
    container_name: weather-proxy
    restart: unless-stopped
    environment:
      - OWM_API_KEY=${OWM_API_KEY}   # we’ll pass it from host env
    expose:
      - "5005"
    # Give it a stable DNS name for the other service
    networks:
      default:
        aliases:
          - weather-proxy

networks:
  default:
    driver: bridge

volumes:
  # Pinned to the plain volume names (no compose project prefix) so the stack
  # keeps using the existing open-webui data instead of a fresh empty volume.
  open-webui:
    name: open-webui
  open-webui-ollama:
    name: open-webui-ollama
